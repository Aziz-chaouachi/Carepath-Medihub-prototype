        /* Full Viewport Map Container */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100vh; }

        /* Custom Marker Icons */
        .custom-marker {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
        }
        .custom-marker:hover { transform: scale(1.15); }

        /* Popup Styling */
        .maplibregl-popup-content {
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .popup-content h3 { margin: 0 0 8px 0; color: #111; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .popup-content p { margin: 4px 0; color: #555; font-size: 0.9rem; }
        .popup-content strong { color: #333; }
        .nav-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            background: #4285F4;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;

        .nav-link:hover { background: #3367d6; }

    let activeMarkers = [];
    let currentCategory = 'all';
    let currentSearchQuery = '';

    // Clear map markers and route
    window.clearMap = function() {
        activeMarkers.forEach(item => item.marker.remove());
        activeMarkers = [];
        clearRoute();
    };

    // Core function to draw markers on the map
    function renderFacilitiesList(list) {
        window.clearMap();

        list.forEach(facility => {
            const facilityType = facility.Type ? facility.Type.toLowerCase() : "";
            const lat = facility.latitude;
            const lng = facility.longitude;

            if (!lat || !lng) return;

            // Dynamic Colors and Icons based on exact Type
            let color = '#333';
            let icon = '🏥'; 

            if (facilityType === 'public') color = '#d32f2f'; 
            else if (facilityType === 'public/rh') { color = '#9c27b0'; icon = '🏥'; }
            else if (facilityType === 'public/univ/scho') { color = '#673ab7'; icon = '🎓'; }
            else if (facilityType === 'private') { color = '#1976d2'; icon = '🩺'; }
            else if (facilityType === 'csb') { color = '#388e3c'; icon = '⚕️'; }
            else if (facilityType === 'rc') { color = '#ff9800'; icon = '☢️'; }

            // Create Marker Element
            const el = document.createElement('div');
            el.className = 'custom-marker';
            el.style.backgroundColor = color;
            el.innerHTML = icon;

            // Build Popup Content
            let popupHTML = `<div class="popup-content">
                                <h3>${icon} ${facility.Name || 'Facility'}</h3>
                                <p><strong>Address:</strong> ${facility.Adresse || 'N/A'}</p>`;
            if (facility.Tel && facility.Tel !== "nan") popupHTML += `<p><strong>Tel:</strong> ${facility.Tel}</p>`;
            if (facility.Website && facility.Website !== "nan") popupHTML += `<p><strong>Web:</strong> <a href="${facility.Website}" target="_blank">Visit Site</a></p>`;
            popupHTML += `<a class="nav-link" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank">Navigate via Google Maps</a></div>`;

            const popup = new maplibregl.Popup({ offset: 15 }).setHTML(popupHTML);

            // Add Marker to Map
            const marker = new maplibregl.Marker({ element: el })
                .setLngLat([lng, lat])
                .setPopup(popup)
                .addTo(map);
            
            activeMarkers.push({ facility, marker, popup });
        });
    }

    // Helper function combining category filter and search bar query
    function applyFilters() {
        const query = currentSearchQuery.toLowerCase().trim();

        const filtered = facilities.filter(facility => {
            const facilityType = facility.Type ? facility.Type.toLowerCase() : "";

            // 1. Check Category Match
            let categoryMatch = false;
            if (currentCategory === 'all') categoryMatch = true;
            else if (currentCategory === 'hospital' && facilityType === 'public') categoryMatch = true;
            else if (currentCategory === 'regional' && facilityType === 'public/rh') categoryMatch = true;
            else if (currentCategory === 'university' && facilityType === 'public/univ/scho') categoryMatch = true;
            else if (currentCategory === 'clinic' && facilityType === 'private') categoryMatch = true;
            else if (currentCategory === 'csb' && facilityType === 'csb') categoryMatch = true;
            else if (currentCategory === 'radiology' && facilityType === 'rc') categoryMatch = true;

            if (!categoryMatch) return false;

            // 2. Check Search Query Match
            if (!query) return true;

            const nameMatch = facility.Name && facility.Name.toLowerCase().includes(query);
            const addrMatch = facility.Adresse && facility.Adresse.toLowerCase().includes(query);
            const stateMatch = facility.State && facility.State.toLowerCase().includes(query);
            const typeMatch = facility.Type && facility.Type.toLowerCase().includes(query);

            return nameMatch || addrMatch || stateMatch || typeMatch;
        });

        renderFacilitiesList(filtered);
    }

    // Exposed Filter Function for Dropdown
    window.filterMap = function(category) {
        currentCategory = category;
        applyFilters();
    };

    // Exposed Search Function for Header Search Input
    window.searchMap = function(query) {
        currentSearchQuery = query;
        applyFilters();
    };

    // Initial load: render all facilities
    applyFilters();

    // Haversine Distance Formula (km)
    window.getDistance = function(lon1, lat1, lon2, lat2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    };

    // Find Nearest and Draw Route
    window.findNearestAndRoute = async function() {
        if (!userCoords) {
            alert("Please click the GPS target icon in the top right corner to allow location access first.");
            return;
        }
        if (activeMarkers.length === 0) return;

        let closest = null;
        let minDistance = Infinity;

        activeMarkers.forEach(item => {
            const dist = window.getDistance(userCoords[0], userCoords[1], item.facility.longitude, item.facility.latitude);
            if (dist < minDistance) {
                minDistance = dist;
                closest = item;
            }
        });

        if (closest) {
            const start = `${userCoords[0]},${userCoords[1]}`;
            const end = `${closest.facility.longitude},${closest.facility.latitude}`;
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start};${end}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(osrmUrl);
                const data = await response.json();
                const routeGeoJSON = data.routes[0].geometry;

                drawRoute(routeGeoJSON);
                
                map.flyTo({ center: [closest.facility.longitude, closest.facility.latitude], zoom: 14 });
                closest.marker.togglePopup();
            } catch (error) {
                console.error("Error fetching route:", error);
                alert("Could not calculate driving route.");
            }
        }
    };

    // Draw Route Line on Map
    function drawRoute(geojsonData) {
        clearRoute(); 
        map.addSource('route', {
            'type': 'geojson',
            'data': { 'type': 'Feature', 'properties': {}, 'geometry': geojsonData }
        });
        map.addLayer({
            'id': 'route',
            'type': 'line',
            'source': 'route',
            'layout': { 'line-join': 'round', 'line-cap': 'round' },
            'paint': { 'line-color': '#f39c12', 'line-width': 6, 'line-opacity': 0.8 }
        });
    }

    function clearRoute() {
        if (map.getLayer('route')) map.removeLayer('route');
        if (map.getSource('route')) map.removeSource('route');
    }
